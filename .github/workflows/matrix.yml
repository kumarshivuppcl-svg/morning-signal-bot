name: FnO Matrix
on:
  schedule:
    # Every 10 minutes, 03:00-10:59 UTC = 08:30-16:29 IST, Mon-Fri.
    # The script's own guard keeps only 9:18-15:40 IST snapshots.
    - cron: "*/10 3-10 * * 1-5"
  workflow_dispatch: {}
concurrency:
  group: fno-matrix
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python fno_matrix.py
      - name: Commit snapshot
        run: |
          git config user.name "matrix-bot"
          git config user.email "matrix@bot"
          git pull --rebase -q || true
          git add data/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "matrix $(date -u +%H:%M)"
          git push || true
